global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s
  external_labels:
    monitor: 'gpu-server'

# ── 알람 룰 파일 (추후 확장용) ─────────────────────────────
# rule_files:
#   - /etc/prometheus/rules/*.yml

scrape_configs:

  # ── Prometheus 자체 ────────────────────────────────────────
  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]

  # ── Node Exporter (호스트 리소스) ─────────────────────────
  - job_name: "node-exporter"
    scrape_interval: 15s
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          instance: "gpu-server"

  # ── cAdvisor (컨테이너 메트릭) ────────────────────────────
  - job_name: "cadvisor"
    scrape_interval: 10s
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          instance: "gpu-server"
    # 불필요한 cAdvisor 고카디날리티 메트릭 제거
    metric_relabel_configs:
      # 노이즈 메트릭 드롭
      - source_labels: [__name__]
        regex: 'container_(network_tcp_usage_total|tasks_state|cpu_load_average_10s|memory_failures_total)'
        action: drop
      # Docker Compose 내부 라벨은 메트릭에서 제거 (cardinality 감소)
      # action: labeldrop → 메트릭 자체는 보존하고 라벨만 제거
      - regex: 'container_label_com_docker_compose_.*'
        action: labeldrop
      - regex: 'container_label_org_opencontainers_.*'
        action: labeldrop

  # ── DCGM Exporter (NVIDIA GPU) ────────────────────────────
  - job_name: "dcgm-exporter"
    scrape_interval: 10s
    static_configs:
      - targets: ["dcgm-exporter:9400"]
        labels:
          instance: "gpu-server"
