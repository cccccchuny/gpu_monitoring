# ════════════════════════════════════════════════════════════
#  GPU 서버 모니터링 스택
#  기본 구동 (GPU 없는 서버): docker compose --env-file .env up -d
#  GPU 포함 구동 (GPU 서버):  docker compose --env-file .env --profile gpu up -d
# ════════════════════════════════════════════════════════════

networks:
  monitoring:
    driver: bridge

volumes:
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

services:

  # ── Prometheus ─────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}'
      - '--web.enable-lifecycle'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - monitoring
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Grafana ────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      - TZ=${TZ:-Asia/Seoul}
      - GF_SECURITY_ADMIN_USER=${GF_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD:-admin123}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/01-container-list.json
      - GF_SERVER_ROOT_URL=http://localhost:${GRAFANA_PORT:-3000}
      - GF_LOG_LEVEL=warn
    networks:
      - monitoring
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Node Exporter ──────────────────────────────────────────
  # 호스트 리소스: CPU / Memory / Disk / Network
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    ports:
      - "${NODE_EXPORTER_PORT:-9100}:9100"
    volumes:
      - /:/host:ro,rslave
    command:
      - '--path.rootfs=/host'
      # overlay/tmpfs 등 컨테이너 내부 가상 파일시스템 제외 → 실제 파티션만 수집
      - '--collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+)($$|/)'
      - '--collector.filesystem.fs-types-exclude=^(tmpfs|overlay|squashfs|nsfs|sysfs|cgroup|cgroup2|devtmpfs|debugfs|tracefs|fusectl|hugetlbfs|mqueue|pstore|bpf|rpc_pipefs)$$'
      - '--collector.netclass.ignored-devices=^(veth|docker|br-|lo).*'
    networks:
      - monitoring
    pid: host

  # ── cAdvisor ───────────────────────────────────────────────
  # 컨테이너별 리소스 사용량 (CPU / Memory / Network / 컨테이너 목록)
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: unless-stopped
    ports:
      - "${CADVISOR_PORT:-8080}:8080"
    volumes:
      - /:/rootfs:ro,rslave
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro,rslave
      - /var/run:/var/run:rw
      - /dev/kmsg:/dev/kmsg:ro
    devices:
      - /dev/kmsg:/dev/kmsg
    privileged: true
    command:
      - '--housekeeping_interval=10s'
      - '--docker_only=true'
      - '--store_container_labels=false'
      - '--disable_metrics=percpu,sched,tcp,udp,advtcp,hugetlb,referenced_memory,resctrl,cpuset,memory_numa'
    networks:
      - monitoring
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── DCGM Exporter ──────────────────────────────────────────
  # NVIDIA GPU: 온도 / VRAM / 사용률 / 전력 / 클럭
  # 사전 조건: nvidia-container-toolkit 설치 필요
  # profiles: [gpu] → --profile gpu 옵션 시에만 구동
  dcgm-exporter:
    image: nvcr.io/nvidia/k8s/dcgm-exporter:latest
    container_name: dcgm-exporter
    profiles: ["gpu"]
    restart: unless-stopped
    ports:
      - "${DCGM_EXPORTER_PORT:-9400}:9400"
    environment:
      - DCGM_EXPORTER_LISTEN=:9400
      - DCGM_EXPORTER_INTERVAL=${DCGM_INTERVAL:-5000}
    # NVIDIA GPU 접근 권한 (nvidia-container-toolkit 필요)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    cap_add:
      - SYS_ADMIN
    networks:
      - monitoring
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9400/metrics"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
